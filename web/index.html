<!DOCTYPE html>
<html lang="en" style="font-size: 125%;">
<head>
  <meta charset="UTF-8">
  <title>Madison AI Workstation</title>
  <!-- Direct CDN Scripts -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@4.3.0/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.2/styles/atom-one-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.2/highlight.min.js"></script>
  <style>
    .gutter-h { width: 4px; cursor: col-resize; transition: background-color 0.2s; }
    .gutter-h:hover, .gutter-h.resizing { background-color: #38bdf8; }
    .gutter-v { height: 4px; cursor: row-resize; transition: background-color 0.2s; }
    .gutter-v:hover, .gutter-v.resizing { background-color: #38bdf8; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #090d16; }
    ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #334155; }
    
    .markdown-body pre { background: #020617; border: 1px solid #1e293b; border-radius: 0.5rem; padding: 0.75rem; margin-top: 0.5rem; margin-bottom: 0.5rem; overflow-x: auto; position: relative; }
    .markdown-body code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 0.85em; }
    .markdown-body p { margin-bottom: 0.5rem; line-height: 1.5; }
    .markdown-body p:last-child { margin-bottom: 0; }
    .markdown-body ul { list-style-type: disc; margin-left: 1.25rem; margin-bottom: 0.5rem; }
    .markdown-body ol { list-style-type: decimal; margin-left: 1.25rem; margin-bottom: 0.5rem; }
    .markdown-body h1, .markdown-body h2, .markdown-body h3 { font-weight: bold; margin-top: 0.75rem; margin-bottom: 0.25rem; color: #38bdf8; }
    .markdown-body table { border-collapse: collapse; width: 100%; margin: 0.5rem 0; font-size: 0.85em; }
    .markdown-body th, .markdown-body td { border: 1px solid #334155; padding: 0.35rem 0.6rem; text-align: left; }
    .markdown-body th { background: #0f172a; color: #38bdf8; }
    .markdown-body blockquote { border-left: 3px solid #38bdf8; padding-left: 0.75rem; color: #94a3b8; font-style: italic; margin: 0.5rem 0; }

    .auto-expand-textarea {
      min-height: 48px;
      max-height: 240px;
      overflow-y: auto;
      resize: none;
      line-height: 1.45;
    }

    @keyframes pulse-green {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.15); }
    }
    .unread-pulse { animation: pulse-green 1.5s infinite ease-in-out; }

    /* Spinner styles */
    .spinner {
      border: 2px solid rgba(255, 255, 255, 0.1);
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border-left-color: #38bdf8;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 h-screen w-screen flex flex-col font-sans overflow-hidden select-none">
  
  <!-- Global Top Navbar -->
  <header class="bg-slate-950 border-b border-slate-800 px-6 py-3 flex flex-wrap justify-between items-center gap-4 shrink-0 z-20">
    <div class="flex items-center gap-3">
      <div class="w-7 h-7 rounded-lg bg-gradient-to-tr from-sky-500 to-indigo-600 flex items-center justify-center font-black text-sm text-white shadow">M</div>
      <h1 class="text-lg font-bold bg-gradient-to-r from-sky-400 to-indigo-300 bg-clip-text text-transparent">Madison</h1>
      <span class="text-xs bg-slate-800 text-slate-400 px-2.5 py-0.5 rounded border border-slate-700">Workstation v3.8</span>
    </div>

    <div class="flex items-center gap-2">
      <button onclick="switchView('chat')" id="navBtnChat" class="relative px-3.5 py-1.5 text-xs font-semibold rounded bg-sky-600 text-white transition flex items-center gap-1.5">
        <span>💬 Chat</span>
        <span id="chatTabUnreadDot" class="hidden w-2 h-2 rounded-full bg-emerald-400 unread-pulse"></span>
      </button>

      <button onclick="switchView('studio')" id="navBtnStudio" class="relative px-3.5 py-1.5 text-xs font-semibold rounded bg-slate-800 text-slate-300 hover:text-white transition flex items-center gap-1.5">
        <span>💻 Code Studio</span>
      </button>

      <button onclick="switchView('history')" id="navBtnHistory" class="px-3.5 py-1.5 text-xs font-semibold rounded bg-slate-800 text-slate-300 hover:text-white transition flex items-center gap-1.5">
        📜 Timeline
      </button>

      <button onclick="switchView('github')" id="navBtnGithub" class="px-3.5 py-1.5 text-xs font-semibold rounded bg-slate-800 text-slate-300 hover:text-white transition flex items-center gap-1.5">
        🔑 Accounts
      </button>

      <button onclick="switchView('models')" id="navBtnModels" class="px-3.5 py-1.5 text-xs font-semibold rounded bg-slate-800 text-slate-300 hover:text-white transition flex items-center gap-1.5">
        📦 Models
      </button>
    </div>

    <div class="flex items-center gap-3 text-xs">
      <div class="bg-slate-900 px-3 py-1 rounded border border-slate-800 text-slate-400">
        VRAM: <span id="vramStat" class="font-semibold text-emerald-400">--</span>
      </div>
      <div class="bg-slate-900 px-3 py-1 rounded border border-slate-800 text-slate-400">
        Storage: <span id="storageStat" class="font-semibold text-amber-400">--</span>
      </div>
      <button onclick="unloadAllModelsGlobal(this)" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 hover:text-rose-300 px-2.5 py-1 rounded font-medium transition">
        ⏹ Unload
      </button>
    </div>
  </header>

  <!-- ==================== VIEW 1: GENERAL CHAT ==================== -->
  <main id="viewChat" class="flex-1 flex overflow-hidden relative select-text">
    <!-- ... (Existing Chat Sidebar and Main Feed) ... -->
    <aside class="w-80 bg-slate-950 border-r border-slate-800 flex flex-col shrink-0 overflow-hidden">
       <div class="p-3.5 border-b border-slate-800 flex justify-between items-center bg-slate-950 shrink-0">
        <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400">Conversations</h2>
        <button onclick="createNewChatSession()" class="text-xs bg-sky-600 hover:bg-sky-500 text-white px-2.5 py-1 rounded font-medium transition">+ New</button>
       </div>
       <div id="generalChatSessionsList" class="flex-1 overflow-y-auto p-2.5 space-y-1.5 text-xs"></div>
    </aside>

    <section class="flex-1 flex flex-col bg-slate-900 overflow-hidden min-w-0">
      <div id="generalChatMessagesWindow" class="flex-1 overflow-y-auto p-4 md:p-6"></div>
      <!-- Chat Input Area -->
    </section>
  </main>

  <!-- ==================== VIEW 2: MODELS MANAGEMENT ==================== -->
  <main id="viewModels" class="hidden flex-1 flex overflow-hidden relative select-text">
    <div class="flex-1 flex flex-col bg-slate-900 overflow-hidden">
      
      <!-- Models Header -->
      <div class="bg-slate-950/80 border-b border-slate-800 px-6 py-4 flex justify-between items-center shrink-0 z-10">
        <div>
          <h2 class="text-xl font-bold text-slate-100">Model Registry</h2>
          <p class="text-xs text-slate-400">Manage local GGUF models and LM Studio integration</p>
        </div>
        <div class="flex items-center gap-3">
          <button id="btnRefreshModels" onclick="refreshModels()" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 px-4 py-2 rounded font-medium transition flex items-center gap-2 text-xs">
            <span id="refreshIcon"><svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg></span>
            <span id="refreshText">Refresh Models</span>
          </button>
        </div>
      </div>

      <!-- Models Content -->
      <div class="flex-1 overflow-y-auto p-6">
        <div class="max-w-5xl mx-auto">
          <div id="modelsLoadingState" class="hidden flex flex-col items-center justify-center py-20 text-slate-500">
            <div class="spinner mb-4 w-8 h-8 border-4"></div>
            <p>Scanning model registry...</p>
          </div>

          <div id="modelsGrid" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <!-- Model cards will be injected here -->
          </div>

          <div id="noModelsState" class="hidden flex flex-col items-center justify-center py-20 text-slate-500 border-2 border-dashed border-slate-800 rounded-xl">
            <p>No models found in registry.</p>
            <button onclick="refreshModels()" class="mt-4 text-sky-400 hover:underline text-sm">Try refreshing</button>
          </div>
        </div>
      </div>

    </div>
  </main>

  <!-- ... (Other views like Studio, History, etc.) ... -->

  <script>
    // Global State & Navigation
    function switchView(viewId) {
      const views = ['chat', 'studio', 'history', 'github', 'models'];
      views.forEach(v => {
        const el = document.getElementById(`view${v.charAt(0).toUpperCase() + v.slice(1)}`);
        if (el) el.classList.add('hidden');
        const btn = document.getElementById(`navBtn${v.charAt(0).toUpperCase() + v.slice(1)}`);
        if (btn) {
          btn.classList.remove('bg-sky-600', 'text-white');
          btn.classList.add('bg-slate-800', 'text-slate-300');
        }
      });

      const activeView = document.getElementById(`view${viewId.charAt(0).toUpperCase() + viewId.slice(1)}`);
      if (activeView) activeView.classList.remove('hidden');
      
      const activeBtn = document.getElementById(`navBtn${viewId.charAt(0).toUpperCase() + viewId.slice(1)}`);
      if (activeBtn) {
        activeBtn.classList.remove('bg-slate-800', 'text-slate-300');
        activeBtn.classList.add('bg-sky-600', 'text-white');
      }

      if (viewId === 'models') loadModels();
    }

    // Models Logic
    async function loadModels() {
      const grid = document.getElementById('modelsGrid');
      const loading = document.getElementById('modelsLoadingState');
      const empty = document.getElementById('noModelsState');
      
      grid.innerHTML = '';
      loading.classList.remove('hidden');
      empty.classList.add('hidden');

      try {
        const resp = await fetch('/models/list');
        const data = await resp.json();
        const models = data.models || [];

        loading.classList.add('hidden');
        if (models.length === 0) {
          empty.classList.remove('hidden');
          return;
        }

        models.forEach(m => {
          const card = document.createElement('div');
          card.className = `p-4 rounded-xl border ${m.loaded ? 'border-emerald-500/30 bg-emerald-500/5' : 'border-slate-800 bg-slate-950'} flex justify-between items-center`;
          card.innerHTML = `
            <div class="min-w-0">
              <div class="text-sm font-bold text-slate-100 truncate" title="${m.display_name}">${m.display_name}</div>
              <div class="text-[10px] uppercase tracking-wider ${m.loaded ? 'text-emerald-400' : 'text-slate-500'} font-bold">
                ${m.loaded ? '● Loaded' : '○ Available'}
              </div>
            </div>
            <button onclick="loadModel('${m.key}')" class="px-3 py-1.5 text-[10px] rounded bg-slate-800 hover:bg-sky-600 transition ${m.loaded ? 'hidden' : ''}">
              Load
            </button>
          `;
          grid.appendChild(card);
        });
      } catch (err) {
        console.error(err);
        loading.classList.add('hidden');
      }
    }

    async function refreshModels() {
      const btn = document.getElementById('btnRefreshModels');
      const icon = document.getElementById('refreshIcon');
      const text = document.getElementById('refreshText');
      
      btn.disabled = true;
      icon.innerHTML = '<div class="spinner"></div>';
      text.innerText = 'Refreshing...';

      try {
        await fetch('/models/refresh', { method: 'POST' });
        await loadModels();
      } catch (err) {
        alert('Failed to refresh models.');
      } finally {
        btn.disabled = false;
        icon.innerHTML = '<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>';
        text.innerText = 'Refresh Models';
      }
    }

    async function loadModel(key) {
      // Implementation for loading model via API...
      console.log("Loading:", key);
    }

    // Initial Load
    window.onload = () => {
      switchView('chat');
    };
  </script>
</body>
</html>
